version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: porchat-postgres
    restart: always
    environment:
      POSTGRES_USER: porchat
      POSTGRES_PASSWORD: porchat_secret
      POSTGRES_DB: porchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porchat -d porchat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
