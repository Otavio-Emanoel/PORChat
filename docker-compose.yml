services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: porchat-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      JWT_SECRET: "${JWT_SECRET:-porchat-super-secure-production-secret}"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - porchat-network

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: porchat-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      NODE_ENV: "production"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8081}"
      NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-ws://localhost:8081/ws}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - porchat-network

networks:
  porchat-network:
    driver: bridge
