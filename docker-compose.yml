version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: porchat-postgres
    restart: always
    environment:
      POSTGRES_USER: porchat
      POSTGRES_PASSWORD: porchat_secret
      POSTGRES_DB: porchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porchat -d porchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: porchat-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://porchat:porchat_secret@postgres:5432/porchat?sslmode=disable"
      JWT_SECRET: "porchat-super-secure-production-secret"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
